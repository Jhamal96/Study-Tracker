name: Build Study Timer Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: write

concurrency:
  group: study-timer-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - name: Install SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build test APK
        working-directory: android
        run: gradle --no-daemon :app:assembleDebug
      - name: Prepare APK
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/debug/app-debug.apk dist/Study-Timer-Android.apk
          cd dist
          sha256sum Study-Timer-Android.apk > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Study-Timer-Android-APK
          path: dist/*
          if-no-files-found: error
          retention-days: 60
      - name: Publish on reusable android-latest release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if gh release view android-latest >/dev/null 2>&1; then
            gh release upload android-latest dist/Study-Timer-Android.apk dist/SHA256SUMS.txt --clobber
          else
            gh release create android-latest dist/Study-Timer-Android.apk dist/SHA256SUMS.txt \
              --target "$GITHUB_SHA" --title "Study Timer — Android test APK" \
              --notes "Debug APK for private testing only. Install on Android; external account links may open in your default browser. Signed release builds with a stable keystore are needed for reliable in-place updates." --prerelease
          fi
