name: AJDNativeTimers
options:
  bundleIdPrefix: org.ajdapp
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    TARGETED_DEVICE_FAMILY: '1,2'
    CODE_SIGN_STYLE: Automatic
    GENERATE_INFOPLIST_FILE: NO
    MARKETING_VERSION: '0.1.0'
    CURRENT_PROJECT_VERSION: '1'
    INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
    INFOPLIST_KEY_UILaunchScreen_Generation: YES
    INFOPLIST_KEY_UIBackgroundModes: [audio]
    INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: 'UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight'
    INFOPLIST_KEY_UISupportedInterfaceOrientations: 'UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight'
targets:
  StudyTimerApple:
    type: application
    platform: iOS
    sources:
      - Sources
      - Assets/study/Assets.xcassets
    info:
      path: Generated/StudyTimerApple-Info.plist
      properties:
        CFBundleDisplayName: Study Timer
        AJDHomeURL: https://studytimer.ajdapp.org/
        AJDTimerKind: study
        UIBackgroundModes: [audio]
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.ajdapp.studytimer.apple
        INFOPLIST_KEY_CFBundleDisplayName: Study Timer
        INFOPLIST_KEY_AJDHomeURL: https://studytimer.ajdapp.org/
        INFOPLIST_KEY_AJDTimerKind: study
  BreakTrackerApple:
    type: application
    platform: iOS
    sources:
      - Sources
      - Assets/break/Assets.xcassets
    info:
      path: Generated/BreakTrackerApple-Info.plist
      properties:
        CFBundleDisplayName: Break Tracker
        AJDHomeURL: https://tracker.ajdapp.org/
        AJDTimerKind: break
        UIBackgroundModes: [audio]
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.ajdapp.breaktracker.apple
        INFOPLIST_KEY_CFBundleDisplayName: Break Tracker
        INFOPLIST_KEY_AJDHomeURL: https://tracker.ajdapp.org/
        INFOPLIST_KEY_AJDTimerKind: break
  TimerClockTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    dependencies:
      - target: StudyTimerApple
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.ajdapp.timerclock.tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  StudyTimerApple:
    build:
      targets:
        StudyTimerApple: all
    test:
      targets: [TimerClockTests]
  BreakTrackerApple:
    build:
      targets:
        BreakTrackerApple: all
